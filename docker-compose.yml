# Phase 0 baseline compose file for local development placeholders.
services:
  jupyter:
    image: jupyter/base-notebook:python-3.11
    container_name: euro_air_quality_jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/workspace
    working_dir: /workspace

  kafka:
    image: bitnami/kafka:3.7.0
    container_name: euro_air_quality_kafka
    ports:
      - "9092:9092"
    environment:
      # Placeholder values for Phase 0 only.
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true

  spark:
    image: bitnami/spark:3.5.6
    container_name: euro_air_quality_spark
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8080:8080"
