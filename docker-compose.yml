name: euro-air-quality-pipeline

services:
  postgres:
    image: postgres:17-alpine
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: euro_air_quality
      POSTGRES_USER: euro_air_quality
      POSTGRES_PASSWORD: euro_air_quality
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U euro_air_quality -d euro_air_quality" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  spark-master:
    image: spark:3.5.7-scala2.12-java17-python3-ubuntu
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/spark-master/7077'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  spark-worker:
    image: spark:3.5.7-scala2.12-java17-python3-ubuntu
    hostname: spark-worker
    user: root
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - .:/workspace
      - spark-checkpoints:/workspace/data/checkpoints

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter.Dockerfile
    hostname: jupyter
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
    env_file:
      - .env.docker.example
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
      - spark-ivy-cache:/root/.ivy2
      - spark-checkpoints:/workspace/data/checkpoints
      - /var/run/docker.sock:/var/run/docker.sock

  shutdown-helper:
    image: docker:27-cli
    profiles: [ "cleanup" ]
    network_mode: none
    working_dir: /workspace
    entrypoint: [ "/bin/sh", "-c" ]
    volumes_from:
      - jupyter
    command: [ "sleep 2; docker compose down --remove-orphans; docker rm -f $$HOSTNAME" ]

volumes:
  postgres-data:
  spark-ivy-cache:
  spark-checkpoints:
